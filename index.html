<title>Sosian Ranch | Private</title>

<style>
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:linear-gradient(135deg,#152a1e,#2f6a45);color:#1d2419;}
.card{background:#eef5e7;border-radius:14px;padding:34px 28px;width:100%;max-width:380px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);}
.logo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #c9a227;}
h1{font-family:Georgia,serif;font-size:24px;margin:14px 0 4px;color:#1f3d2b;}
p{margin:0 0 18px;color:#3b4a37;font-size:14.5px;line-height:1.5;}
.field{display:flex;gap:8px;}
input{flex:1;min-width:0;padding:12px;border:1px solid #bcd3b1;border-radius:8px;font-size:16px;}
.eye{background:#fff;border:1px solid #bcd3b1;border-radius:8px;padding:0 12px;cursor:pointer;font-size:16px;}
.go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:8px;background:#25a244;color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.go:disabled{opacity:.6;cursor:wait;}
.err{min-height:20px;margin-top:12px;color:#b3261e;font-size:14px;font-weight:600;}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">

  <p>This website is private.<br>Enter the password to continue.</p>

    <input type="password" id="pw" placeholder="Password" autofocus required>
    <button type="button" class="eye" id="eye" aria-label="Show password">&#128065;</button>
  </div>
  <button class="go" id="go" type="submit">Unlock</button>
  <div class="err" id="err"></div>
</form>

const ITER = 310000;
const f = document.getElementById('f'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), go = document.getElementById('go');

document.getElementById('eye').onclick = () => { pw.type = pw.type === 'password' ? 'text' : 'password'; };

async function decrypt(password){
  const b = Uint8Array.from(atob(DATA), c => c.charCodeAt(0));
  const salt = b.slice(0,16), iv = b.slice(16,28), ct = b.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'},
                base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(plain);
}

async function tryUnlock(password, silent){
  if (!window.crypto || !crypto.subtle){
    err.textContent = 'Please open this site using https:// (secure link).';
    return;
  }
  go.disabled = true; err.textContent = silent ? '' : 'Checking...';
  try{
    const html = await decrypt(password);
    sessionStorage.setItem('sosian_k', password);   // stays only until this tab is closed
    document.open(); document.write(html); document.close();
  }catch(e){
    sessionStorage.removeItem('sosian_k');
    go.disabled = false;
    err.textContent = silent ? '' : 'Wrong password. Please try again.';
    if(!silent){ pw.select(); }
  }
}

f.addEventListener('submit', e => { e.preventDefault(); tryUnlock(pw.value, false); });

const saved = sessionStorage.getItem('sosian_k');
if (saved) tryUnlock(saved, true);
